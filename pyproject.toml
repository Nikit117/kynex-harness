[project]
name = "nikit-harness"
version = "0.1.0"
description = "A local, tool-using document-extraction agent (TUI v3)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "autonomous_document_harness",
    "autonomous_document_harness.core",
    "autonomous_document_harness.deep",
    "autonomous_document_harness.models",
    "autonomous_document_harness.tools",
    "autonomous_document_harness.parsers",
    "autonomous_document_harness.workspace",
    "autonomous_document_harness.verification",
    "autonomous_document_harness.tui",
    "autonomous_document_harness.eval",
    "autonomous_document_harness.eval.extractbench",
    "autonomous_document_harness.scripts",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
