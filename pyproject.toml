[project]
name = "nikit-harness"
version = "0.1.0"
description = "A local, tool-using document-extraction agent (TUI v3)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "autonomous_document_harness",
    "autonomous_document_harness.core",
    "autonomous_document_harness.deep",
    "autonomous_document_harness.models",
    "autonomous_document_harness.tools",
    "autonomous_document_harness.parsers",
    "autonomous_document_harness.workspace",
    "autonomous_document_harness.verification",
    "autonomous_document_harness.tui",
    "autonomous_document_harness.eval",
    "autonomous_document_harness.eval.extractbench",
    "autonomous_document_harness.scripts",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The harness is vendored as it was measured, so the strict rule sets would
# fail on code that is not ours.  E4/E7/E9 catch real problems (undefined
# names, syntax errors); the unused-name rules are relaxed for the vendored
# tree only -- new code is held to the full standard.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"autonomous_document_harness/**" = ["F401", "F811", "F841"]
"tests/**" = ["F401", "F811", "F841", "E741"]
