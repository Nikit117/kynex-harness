<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- Logo -->
  <g transform="translate(180,200) scale(1.8)">
    <path d="M-30,-44 L16,-44 L30,-30 L30,44 L-30,44 Z" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round" opacity="0.5"/>
    <path d="M16,-44 L16,-30 L30,-30" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round" opacity="0.5"/>
    <path d="M-16,-24 L-16,24" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <path d="M-16,2 L14,-24" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <path d="M-4,7 L18,24" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <g transform="translate(26,-36)">
      <path d="M0,-8 L1.5,-2.5 L8,0 L1.5,2.5 L0,8 L-1.5,2.5 L-8,0 L-1.5,-2.5 Z" fill="#fbbf24"/>
    </g>
  </g>
  <!-- Title -->
  <text x="340" y="240" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold">KYNEX</text>
  <!-- Subtitle -->
  <text x="340" y="290" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="24">Agentic Document Extraction</text>
  <!-- Rank badge -->
  <g transform="translate(340,330)">
    <rect width="340" height="56" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text x="20" y="37" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="26" font-weight="bold">Rank 12/53</text>
    <text x="195" y="37" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="22">92.97 F1</text>
  </g>
  <!-- Verified badge -->
  <g transform="translate(700,330)">
    <rect width="320" height="56" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <text x="20" y="37" fill="#22c55e" font-family="system-ui, sans-serif" font-size="22">Verified by LlamaIndex</text>
  </g>
  <!-- Bottom info -->
  <text x="340" y="460" fill="#64748b" font-family="system-ui, sans-serif" font-size="20">ExtractBench Leaderboard  |  Open Source  |  Built Solo  |  $0.05/page</text>
  <!-- GitHub -->
  <text x="340" y="510" fill="#475569" font-family="monospace" font-size="18">github.com/Nikit117/kynex-harness</text>
