<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="KYNEX">
  <!-- Combo 1: Bold K with document silhouette behind + spark -->
  <defs>
    <linearGradient id="gc1" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0f172a"/>
  <g transform="translate(64,64)">
    <!-- Ghost document behind -->
    <path d="M-28,-42 L14,-42 L26,-30 L26,42 L-28,42 Z" fill="none" stroke="url(#gc1)" stroke-width="2" opacity="0.2" stroke-linejoin="round"/>
    <path d="M14,-42 L14,-30 L26,-30" fill="none" stroke="url(#gc1)" stroke-width="2" opacity="0.2" stroke-linejoin="round"/>
    <!-- Bold K -->
    <path d="M-18,-30 L-18,30" stroke="url(#gc1)" stroke-width="9" stroke-linecap="round"/>
    <path d="M-18,2 L16,-30" stroke="url(#gc1)" stroke-width="9" stroke-linecap="round"/>
    <path d="M-6,8 L20,30" stroke="url(#gc1)" stroke-width="9" stroke-linecap="round"/>
    <!-- Spark -->
    <g transform="translate(30,-24)">
      <path d="M0,-7 L1.5,-2 L7,0 L1.5,2 L0,7 L-1.5,2 L-7,0 L-1.5,-2 Z" fill="#fbbf24"/>
    </g>
  </g>
</svg>
