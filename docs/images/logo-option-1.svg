<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="KYNEX">
  <!-- Option 1: Bold "K" monogram with circuit lines -->
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0f172a"/>
  <!-- Stylized K -->
  <g transform="translate(64,64)" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="-20" y1="-36" x2="-20" y2="36"/>
    <line x1="-20" y1="0" x2="20" y2="-36"/>
    <line x1="-20" y1="0" x2="20" y2="36"/>
    <!-- circuit dots -->
    <circle cx="-20" cy="-36" r="4" fill="url(#g1)" stroke="none"/>
    <circle cx="-20" cy="36" r="4" fill="url(#g1)" stroke="none"/>
    <circle cx="20" cy="-36" r="4" fill="url(#g1)" stroke="none"/>
    <circle cx="20" cy="36" r="4" fill="url(#g1)" stroke="none"/>
    <circle cx="-20" cy="0" r="3" fill="#0f172a" stroke="url(#g1)" stroke-width="3"/>
  </g>
</svg>
