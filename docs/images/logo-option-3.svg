<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="KYNEX">
  <!-- Option 3: Abstract document with extraction beam -->
  <defs>
    <linearGradient id="g3a" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="g3b" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0f172a"/>
  <g transform="translate(64,64)">
    <!-- Document shape -->
    <path d="M-22,-38 L12,-38 L22,-28 L22,38 L-22,38 Z" fill="none" stroke="url(#g3a)" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Folded corner -->
    <path d="M12,-38 L12,-28 L22,-28" fill="none" stroke="url(#g3a)" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Text lines on document -->
    <line x1="-14" y1="-22" x2="14" y2="-22" stroke="url(#g3a)" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="-14" y1="-12" x2="8" y2="-12" stroke="url(#g3a)" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="-14" y1="-2" x2="14" y2="-2" stroke="url(#g3a)" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <!-- Extraction beam / arrow coming out -->
    <path d="M0,10 L0,30" stroke="url(#g3b)" stroke-width="3" stroke-linecap="round"/>
    <path d="M-6,24 L0,32 L6,24" fill="none" stroke="url(#g3b)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Data nodes extracted -->
    <circle cx="-16" cy="32" r="3" fill="#06b6d4"/>
    <circle cx="16" cy="32" r="3" fill="#8b5cf6"/>
    <circle cx="0" cy="38" r="2" fill="#34d399" opacity="0.7"/>
  </g>
</svg>
