<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="KYNEX">
  <!-- Combo 4: Clean K where the lower arm becomes an extraction arrow + nodes + spark -->
  <defs>
    <linearGradient id="gc4" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="40%" stop-color="#c084fc"/>
      <stop offset="70%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0f172a"/>
  <g transform="translate(64,62)">
    <!-- K vertical -->
    <path d="M-22,-34 L-22,26" stroke="url(#gc4)" stroke-width="9" stroke-linecap="round"/>
    <!-- K upper arm -->
    <path d="M-22,0 L18,-34" stroke="url(#gc4)" stroke-width="9" stroke-linecap="round"/>
    <!-- K lower arm turns into arrow -->
    <path d="M-8,6 L18,28" stroke="url(#gc4)" stroke-width="9" stroke-linecap="round"/>
    <!-- Arrow head at end of lower arm -->
    <path d="M10,18 L20,28 L10,28" fill="none" stroke="url(#gc4)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tiny extracted data dots trailing from arrow -->
    <circle cx="28" cy="34" r="3" fill="#34d399" opacity="0.9"/>
    <circle cx="36" cy="38" r="2.2" fill="#06b6d4" opacity="0.7"/>
    <circle cx="42" cy="41" r="1.5" fill="#8b5cf6" opacity="0.5"/>
    <!-- Spark at top -->
    <g transform="translate(28,-28)">
      <path d="M0,-7 L1.5,-2 L7,0 L1.5,2 L0,7 L-1.5,2 L-7,0 L-1.5,-2 Z" fill="#fbbf24"/>
    </g>
  </g>
</svg>
