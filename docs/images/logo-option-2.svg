<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="KYNEX">
  <!-- Option 2: Hexagonal lens / document scanner eye -->
  <defs>
    <linearGradient id="g2" x1="0" y1="20" x2="128" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0f172a"/>
  <g transform="translate(64,64)">
    <!-- Outer hexagon -->
    <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="none" stroke="url(#g2)" stroke-width="4"/>
    <!-- Inner diamond / eye shape -->
    <path d="M-28,0 C-14,-20 14,-20 28,0 C14,20 -14,20 -28,0 Z" fill="url(#g2)" opacity="0.2" stroke="url(#g2)" stroke-width="2.5"/>
    <!-- Pupil -->
    <circle cx="0" cy="0" r="8" fill="url(#g2)"/>
    <circle cx="0" cy="0" r="3.5" fill="#0f172a"/>
    <!-- Scan lines -->
    <line x1="-34.6" y1="-20" x2="-28" y2="0" stroke="url(#g2)" stroke-width="1.5" opacity="0.4"/>
    <line x1="34.6" y1="-20" x2="28" y2="0" stroke="url(#g2)" stroke-width="1.5" opacity="0.4"/>
    <line x1="-34.6" y1="20" x2="-28" y2="0" stroke="url(#g2)" stroke-width="1.5" opacity="0.4"/>
    <line x1="34.6" y1="20" x2="28" y2="0" stroke="url(#g2)" stroke-width="1.5" opacity="0.4"/>
  </g>
</svg>
