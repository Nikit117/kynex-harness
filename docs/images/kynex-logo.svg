<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="KYNEX">
  <defs>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="26" fill="#0b1220"/>
  <!-- the document -->
  <rect x="30" y="20" width="52" height="74" rx="7" fill="#111c31" stroke="#2b3a55" stroke-width="2"/>
  <!-- the strata: rows of the document, read layer by layer -->
  <g fill="#4a5b7a">
    <rect x="38" y="31" width="36" height="4" rx="2"/>
    <rect x="38" y="41" width="30" height="4" rx="2"/>
    <rect x="38" y="51" width="36" height="4" rx="2"/>
    <rect x="38" y="61" width="24" height="4" rx="2"/>
  </g>
  <!-- the extracted rows -->
  <g fill="#38bdf8">
    <rect x="38" y="74" width="36" height="4" rx="2"/>
    <rect x="38" y="82" width="30" height="4" rx="2"/>
  </g>
  <!-- the yield: a beam leaving the document -->
  <path d="M84 46 L118 24 L118 74 Z" fill="url(#beam)"/>
  <!-- the nexus: the tool knot -->
  <circle cx="106" cy="49" r="9" fill="#0b1220" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="106" cy="49" r="2.6" fill="#38bdf8"/>
</svg>
