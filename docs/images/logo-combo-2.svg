<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="KYNEX">
  <!-- Combo 2: K with extraction beam flowing down + data nodes -->
  <defs>
    <linearGradient id="gc2a" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="gc2b" x1="64" y1="80" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0f172a"/>
  <g transform="translate(64,58)">
    <!-- Bold K -->
    <path d="M-22,-32 L-22,22" stroke="url(#gc2a)" stroke-width="9" stroke-linecap="round"/>
    <path d="M-22,-2 L16,-32" stroke="url(#gc2a)" stroke-width="9" stroke-linecap="round"/>
    <path d="M-8,4 L20,26" stroke="url(#gc2a)" stroke-width="9" stroke-linecap="round"/>
    <!-- Extraction beam from bottom of K -->
    <line x1="-22" y1="28" x2="-22" y2="40" stroke="url(#gc2b)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="20" y1="32" x2="20" y2="40" stroke="url(#gc2b)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <!-- Data nodes -->
    <circle cx="-22" cy="44" r="3.5" fill="#34d399"/>
    <circle cx="-2" cy="44" r="3.5" fill="#06b6d4"/>
    <circle cx="20" cy="44" r="3.5" fill="#8b5cf6"/>
    <!-- Spark -->
    <g transform="translate(28,-26)">
      <path d="M0,-6 L1.2,-1.8 L6,0 L1.2,1.8 L0,6 L-1.2,1.8 L-6,0 L-1.2,-1.8 Z" fill="#fbbf24"/>
    </g>
  </g>
</svg>
